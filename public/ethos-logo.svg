<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8941E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="220" rx="8" fill="#FAFBFC"/>

  <!-- Top gold line -->
  <rect x="0" y="0" width="700" height="3" rx="8 8 0 0" fill="url(#goldGrad)"/>

  <!-- ETHOS main text -->
  <text x="350" y="100" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="80" font-weight="200" letter-spacing="28" fill="#1A2733">
    ETHOS
  </text>

  <!-- MK.1 -->
  <text x="350" y="130" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="18" font-weight="300" letter-spacing="12" fill="#C8941E">
         MK.1
  </text>

  <!-- Thin gold divider -->
  <rect x="200" y="148" width="300" height="0.5" fill="#C8941E" opacity="0.35"/>

  <!-- Full name -->
  <text x="350" y="172" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="10.5" font-weight="300" letter-spacing="5.5" fill="#8899AA">
    ENGINEER-TO-ORDER HUB OPERATION SYSTEM
  </text>

  <!-- MM Engineering -->
  <text x="350" y="196" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="9" font-weight="400" letter-spacing="7" fill="#AAB5C0">
    MM ENGINEERING
  </text>

  <!-- Bottom gold line -->
  <rect x="0" y="217" width="700" height="3" rx="0 0 8 8" fill="url(#goldGrad)"/>
</svg>
