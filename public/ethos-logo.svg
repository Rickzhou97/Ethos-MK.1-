<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A84B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8941E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Top gold line -->
  <rect x="40" y="8" width="340" height="1.5" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- ETHOS main text -->
  <text x="210" y="62" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="300" letter-spacing="18" fill="#FFFFFF">
    ETHOS
  </text>

  <!-- MK.1 -->
  <text x="210" y="82" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="300" letter-spacing="8" fill="#D4A84B">
    MK.1
  </text>

  <!-- Thin gold divider -->
  <rect x="100" y="92" width="220" height="0.5" fill="#C8941E" opacity="0.3"/>

  <!-- Full name -->
  <text x="210" y="108" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="7.5" font-weight="300" letter-spacing="4" fill="rgba(255,255,255,0.5)">
    ENGINEER-TO-ORDER HUB OPERATION SYSTEM
  </text>

  <!-- Bottom gold line -->
  <rect x="40" y="116" width="340" height="1.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
